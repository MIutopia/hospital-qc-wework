# ===================================================
# 住院病例质控系统 - 院内 Nginx 新增 server 块（首选链路①）
# 适用：公网IP:443 → 院内现有 Nginx → 质控后端 :8080
#
# 使用方法（由院方信息科操作，不影响其他业务）：
#   1. 备份现有 nginx.conf
#   2. 将本文件内容追加到 nginx.conf（或 include 本文件）
#   3. nginx -t 校验配置
#   4. nginx -s reload
#   5. 访问验证：https://qc.xxx.cn/api/v1/health 返回 200，且其他业务正常
#
# 前置条件（2026-08-03 院方已确认）：
#   - 备案域名 qc.xxx.cn 已解析到公网 IP，公网 443 已映射到本机
#   - 质控后端服务器可出外网（企微 API 直连，已放行出站 443）
#   - 质控后端内网 IP 假设为 192.168.1.100（请按实际修改）
#   - 前端构建产物（M5 完成后）放置于 /var/www/hospital-qc/frontend/dist
#
# 注意：本文件只新增质控系统的 server 块，不修改其他业务配置
# ===================================================

# ---- 质控后端 upstream（内网地址，按实际修改） ----
upstream hospital_qc_backend {
    server 192.168.1.100:8080;    # ← 质控后端内网 IP:端口
    keepalive 16;
}

# ---- 质控系统 HTTPS 站点 ----
server {
    listen       443 ssl;
    server_name  qc.xxx.cn;       # ← 备案域名（按实际修改）

    # SSL 证书（可与医院现有证书体系一致，或为子域单独签发）
    ssl_certificate      /etc/nginx/ssl/qc.xxx.cn.pem;   # ← 按实际路径修改
    ssl_certificate_key  /etc/nginx/ssl/qc.xxx.cn.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_session_cache    shared:SSL_QC:10m;
    ssl_session_timeout  10m;

    # 安全头
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ★ 企微「可信域名」验证文件（企微后台下载 WW_verify_*.txt 放入后验证）
    #   验证通过后此块可删除。目录需与文件名匹配，必须可公网访问返回 200。
    location = /WW_verify_xxxx.txt {
        root   /var/www/hospital-qc/verify;   # ← 按实际修改
        access_log off;
    }

    # ---- API 反向代理 → 质控后端 ----
    location /api/ {
        proxy_pass http://hospital_qc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- H5 静态资源（前端构建产物，M5 完成后放置） ----
    location / {
        root   /var/www/hospital-qc/frontend/dist;   # ← 按实际修改
        index  index.html;
        try_files $uri $uri/ /index.html;

        # 哈希文件名静态资源长缓存
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML 不缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# ---- HTTP → HTTPS 跳转（若 80 端口未被其他业务占用；被占用则跳过此块） ----
