# ===================================================
# Nginx for Windows 配置文件
# 住院病例质控企业微信推送系统
# 部署路径：D:\app\hospital-qc\
# ===================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;
    error_log   logs/error.log;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ===================================================
    # API 反向代理（backend :8080）
    # ===================================================
    upstream backend {
        server 127.0.0.1:8080;
        keepalive 64;
    }

    # ===================================================
    # H5 站点 - api.xxx.cn
    # ===================================================
    server {
        listen       443 ssl;
        server_name  api.xxx.cn;

        # SSL 证书（院方提供）
        ssl_certificate      D:/app/hospital-qc/ssl/xxx.cn.pem;
        ssl_certificate_key  D:/app/hospital-qc/ssl/xxx.cn.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;

        # 安全头
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 所有 API 请求转发到后端
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（后续可能用到）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时配置
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # 健康检查（不记录日志）
        location /api/v1/health {
            access_log off;
            proxy_pass http://backend;
        }
    }

    # ===================================================
    # H5 站点 - h5.xxx.cn（前端静态文件）
    # ===================================================
    server {
        listen       443 ssl;
        server_name  h5.xxx.cn;

        ssl_certificate      D:/app/hospital-qc/ssl/xxx.cn.pem;
        ssl_certificate_key  D:/app/hospital-qc/ssl/xxx.cn.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;

        # 安全头
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 前端静态文件
        root D:/app/hospital-qc/frontend/dist;
        index index.html;

        # 静态资源缓存（哈希文件名）
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA 路由：所有非文件请求返回 index.html
        location / {
            try_files $uri $uri/ /index.html;

            # HTML 不缓存
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
        }
    }

    # ===================================================
    # HTTP 重定向到 HTTPS
    # ===================================================
    server {
        listen       80;
        server_name  api.xxx.cn h5.xxx.cn;
        return 301 https://$server_name$request_uri;
    }
}
