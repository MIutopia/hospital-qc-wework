# 住院病例质控系统 - 配置文件
# 优先级：环境变量 > 此文件 > 默认值
# 敏感字段（密码/密钥）仅从环境变量读取

server:
  port: 8080
  mode: debug          # debug / release / test
  read_timeout: 30s
  write_timeout: 30s

database:
  server: "localhost"
  port: 1433
  name: "HospitalQC"
  user: "sa"
  # password: 从环境变量 DB_PASS 读取
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 5m
  encrypt: false       # SQL Server 2014 不支持 encrypt

his_database:
  server: "10.x.x.1"
  port: 1433
  name: "HIS"
  user: "readonly"
  # password: 从环境变量 HIS_DB_PASS 读取
  sync_interval: "24h" # 全量同步间隔
  sync_time: "06:00"   # 每日同步时间

wework:
  corp_id: ""          # 从环境变量 WEWORK_CORP_ID 读取
  agent_id: 0          # 从环境变量 WEWORK_AGENT_ID 读取
  agent_secret: ""     # 从环境变量 WEWORK_AGENT_SECRET 读取
  token_refresh_interval: 3500s  # access_token 刷新间隔（略小于7200s）
  api_base_url: "https://qyapi.weixin.qq.com"

jwt:
  secret: ""           # 从环境变量 JWT_SECRET 读取
  expire_hours: 24

redis:
  addr: ""             # 留空则使用进程内 MemoryCache
  password: ""
  db: 0

qc:
  cron: "10 6 * * *"   # 每日 06:10 执行质控
  batch_size: 100       # 每批质控病例数
  concurrency: 10       # 并发 goroutine 数
  quiet_start: "22:00"  # 免打扰开始时间
  quiet_end: "08:00"    # 免打扰结束时间
  push_cron: "30 6 * * *"  # 每日 06:30 推送

log:
  level: "info"         # debug / info / warn / error
  format: "json"        # json / text
  output: "stdout"      # stdout / file
  file_path: ""         # 文件路径（output=file 时生效）
